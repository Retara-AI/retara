services:
  db:
    image: postgres:16
    container_name: retara-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-retara}
      POSTGRES_USER: ${POSTGRES_USER:-retara}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-retara_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - retara_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-retara}"]
      interval: 5s
      retries: 10
volumes:
  retara_pgdata: